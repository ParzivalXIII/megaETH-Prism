[project]
name = "megaeth-projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.5",
    "aiosqlite>=0.22.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.0",
    "gql[aiohttp]>=4.0.0",
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
    "redis>=5.3.1",
    "sqlmodel>=0.0.38",
    "structlog>=25.5.0",
    "web3[asyncio]>=7.16.0",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fakeredis>=2.36.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]
